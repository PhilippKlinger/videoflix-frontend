version: 2
updates:
  # npm dependencies from package.json and package-lock.json
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait 14 days before proposing a new release; security updates are not delayed.
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # Angular packages only work in matching versions, so they arrive in one PR.
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@videogular/*"
          - "zone.js"
          - "typescript"
    # Angular majors need `ng update` and its migrations, not a version bump.
    # Angular also fixes the supported zone.js and TypeScript versions.
    ignore:
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@videogular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zone.js"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Pinned action SHAs in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    commit-message:
      prefix: "ci(deps)"
