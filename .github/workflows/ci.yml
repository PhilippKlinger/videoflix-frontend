# Actions are pinned by commit SHA; the comment shows the readable version.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # Coverage thresholds live in karma.conf.js and fail the run when coverage drops.
      - name: Run tests with coverage
        run: npm test -- --watch=false --browsers=ChromeHeadlessCI --code-coverage

      # Strict templates make the production build the type check as well.
      - name: Build for production
        run: npm run build -- --configuration production

  image:
    name: Build, scan and publish image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: test
    permissions:
      contents: read
      packages: write
      # Keyless signing of the attestations, public in the repository.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # BuildKit container driver: needed for the GitHub Actions layer cache.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Prepare image name
        id: name
        shell: bash
        run: |
          set -Eeuo pipefail
          OWNER_LOWER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "ref=ghcr.io/${OWNER_LOWER}/videoflix-frontend:${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "repo=ghcr.io/${OWNER_LOWER}/videoflix-frontend" >> "${GITHUB_OUTPUT}"

      - name: Build image with layer cache
        env:
          IMAGE: ${{ steps.name.outputs.ref }}
        run: |
          set -Eeuo pipefail
          docker buildx build \
            --file "Dockerfile" \
            --cache-from "type=gha,scope=videoflix-frontend" \
            --cache-to "type=gha,mode=max,scope=videoflix-frontend" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --build-arg "GIT_SHA=${GITHUB_SHA}" \
            --build-arg "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag "${IMAGE}" \
            --load \
            .

      # Official Trivy image pinned by digest instead of a third-party action.
      # Fails on critical findings that already have a fix.
      - name: Scan image with Trivy
        env:
          IMAGE: ${{ steps.name.outputs.ref }}
        run: |
          set -Eeuo pipefail
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --no-progress --severity HIGH,CRITICAL --ignore-unfixed "${IMAGE}"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --no-progress --quiet --severity CRITICAL --ignore-unfixed --exit-code 1 "${IMAGE}"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      # The digest makes the reference immutable: the deploy repository pins exactly this build.
      - name: Push image and record immutable reference
        id: push
        if: github.event_name == 'push'
        env:
          IMAGE: ${{ steps.name.outputs.ref }}
        run: |
          set -Eeuo pipefail
          PUSH_OUTPUT="$(docker push "${IMAGE}")"
          echo "${PUSH_OUTPUT}"
          DIGEST="$(awk '/digest: sha256:/ {print $3}' <<< "${PUSH_OUTPUT}" | tail -n 1)"
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "### Image" >> "${GITHUB_STEP_SUMMARY}"
          echo '`'"${IMAGE}@${DIGEST}"'`' >> "${GITHUB_STEP_SUMMARY}"
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"

      # Bill of materials of the pushed image, same Trivy image as the scan above.
      - name: Generate SBOM (CycloneDX)
        if: github.event_name == 'push'
        env:
          IMAGE: ${{ steps.name.outputs.ref }}
        run: |
          set -Eeuo pipefail
          docker run --rm             -v /var/run/docker.sock:/var/run/docker.sock             -v "${RUNNER_TEMP}:/out"             aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c             image --no-progress --quiet --format cyclonedx --output /out/sbom.cdx.json "${IMAGE}"

      # Public proof of which workflow and commit built this digest:
      # gh attestation verify oci://IMAGE@DIGEST --repo OWNER/REPO
      - name: Attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.repo }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.repo }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.cdx.json
          push-to-registry: true

      # Last step on purpose: the deploy only starts for an image that passed everything above.
      - name: Trigger deploy
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -Eeuo pipefail
          jq -n --arg digest "${DIGEST}" \
            '{event_type: "image-published", client_payload: {service: "frontend", digest: $digest}}' |
            gh api --method POST repos/PhilippKlinger/videoflix-deploy/dispatches --input -
