# Actions are pinned by commit SHA; the comment shows the readable version.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # Coverage thresholds live in karma.conf.js and fail the run when coverage drops.
      - name: Run tests with coverage
        run: npm test -- --watch=false --browsers=ChromeHeadlessCI --code-coverage

      # Strict templates make the production build the type check as well.
      - name: Build for production
        run: npm run build -- --configuration production

  e2e:
    name: E2E (Compose stack)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tests talk to the real API, so they run against the backend's current main.
      - name: Check out backend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PhilippKlinger/videoflix-backend
          path: backend-stack
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type check the tests
        run: npx tsc --noEmit -p e2e

      # demo-upload runs in the Google Chrome of the runner, auth-smoke in Playwright's Chromium.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Dev template with its relaxed throttle rates (mails, uploads, demos), plus throwaway secrets.
      - name: Start backend stack
        working-directory: backend-stack
        run: |
          set -Eeuo pipefail
          cp .env.dev.template .env
          {
            echo "SECRET_KEY=ci-only-not-secret-${GITHUB_RUN_ID}-padding-to-32-bytes"
            echo "DB_NAME=videoflix_e2e"
            echo "DB_USER=videoflix"
            echo "DB_PASSWORD=ci-only-password"
            echo "RUN_MAKEMIGRATIONS=0"
          } >> .env
          docker compose --profile dev up -d --build
          timeout 180 bash -c 'until curl -fsS http://localhost:8000/api/health/; do sleep 3; done'

      - name: Start frontend
        run: |
          set -Eeuo pipefail
          nohup npm start > ng-serve.log 2>&1 &
          timeout 180 bash -c 'until curl -fsS -o /dev/null http://localhost:4200/; do sleep 3; done'

      - name: Run end-to-end tests
        run: npm run e2e

      - name: Show logs on failure
        if: failure()
        working-directory: backend-stack
        run: |
          docker compose --profile dev ps -a
          docker compose --profile dev logs --no-color --tail 200 web worker
          tail -n 50 ../ng-serve.log

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  image:
    name: Build, scan and publish image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [test, e2e]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # BuildKit container driver: needed for the GitHub Actions layer cache.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Prepare image name
        id: name
        shell: bash
        run: |
          set -Eeuo pipefail
          OWNER_LOWER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "ref=ghcr.io/${OWNER_LOWER}/videoflix-frontend:${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Build image with layer cache
        env:
          IMAGE: ${{ steps.name.outputs.ref }}
        run: |
          set -Eeuo pipefail
          docker buildx build \
            --file "Dockerfile" \
            --cache-from "type=gha,scope=videoflix-frontend" \
            --cache-to "type=gha,mode=max,scope=videoflix-frontend" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${IMAGE}" \
            --load \
            .

      # Official Trivy image pinned by digest instead of a third-party action.
      # Fails on critical findings that already have a fix.
      - name: Scan image with Trivy
        env:
          IMAGE: ${{ steps.name.outputs.ref }}
        run: |
          set -Eeuo pipefail
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --no-progress --severity HIGH,CRITICAL --ignore-unfixed "${IMAGE}"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --no-progress --quiet --severity CRITICAL --ignore-unfixed --exit-code 1 "${IMAGE}"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      # The digest makes the reference immutable: the deploy repository pins exactly this build.
      - name: Push image and record immutable reference
        if: github.event_name == 'push'
        env:
          IMAGE: ${{ steps.name.outputs.ref }}
        run: |
          set -Eeuo pipefail
          PUSH_OUTPUT="$(docker push "${IMAGE}")"
          echo "${PUSH_OUTPUT}"
          DIGEST="$(awk '/digest: sha256:/ {print $3}' <<< "${PUSH_OUTPUT}" | tail -n 1)"
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "### Image" >> "${GITHUB_STEP_SUMMARY}"
          echo '`'"${IMAGE}@${DIGEST}"'`' >> "${GITHUB_STEP_SUMMARY}"
