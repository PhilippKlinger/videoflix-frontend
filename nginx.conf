# Serves the Angular build behind the Caddy edge proxy; /api/, /admin/ and /static/ go to the backend there.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Activation and reset tokens are part of request paths; Caddy and Gunicorn keep no access log either.
    access_log off;

    # add_header here only: a location with its own add_header would drop all of these.
    # Angular adds component styles at runtime ('unsafe-inline' for styles); hls.js plays through
    # Media Source Extensions and a worker, both created from blob: URLs.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "DENY" always;

    # Hidden files and source maps are never served.
    location ~ (^|/)\. { deny all; }
    location ~ \.map$ { deny all; }

    # Hashed bundles can be cached for long; index.html is revalidated on every request.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpe?g|webp|avif|ico)$ { expires 1y; try_files $uri =404; }
    # Fonts keep a stable URL for the preload, so they get a shorter lifetime than hashed bundles.
    location ^~ /fonts/ { expires 30d; try_files $uri =404; }
    location = /index.html { expires -1; }

    # Single-page app: unknown paths fall back to index.html.
    location / { try_files $uri $uri/ /index.html; }
}
