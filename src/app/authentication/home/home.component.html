<app-auth-layout [backgroundImage]="'/assets/backgrounds/start.webp'">
  <div class="home-content">
    <h1>Movies, TV shows, and more</h1>
    <p>Enter your email to create or restart your subscription.</p>

    <form [formGroup]="emailCheckForm" (ngSubmit)="onSubmitEmailCheck()">
      <mat-form-field appearance="outline" class="email-field" floatLabel="always">
        <mat-label>Email Address</mat-label>
        <input matInput type="email" formControlName="email" placeholder="Email Address" />
        @if (emailCheckForm.controls['email'].hasError('required')) {
          <mat-error>
            Email is required
          </mat-error>
        }
        @if (emailCheckForm.controls['email'].hasError('email')) {
          <mat-error>
            Please enter a valid email address
          </mat-error>
        }
      </mat-form-field>

      <button mat-raised-button color="primary" class="signup-button" type="submit"
        [disabled]="!emailCheckForm.valid || requestloading">
        Sign Up
        <mat-icon>arrow_forward_ios</mat-icon>
      </button>
    </form>

    <app-demo-button></app-demo-button>
  </div>
</app-auth-layout>
