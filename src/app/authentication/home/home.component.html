<app-auth-layout [backgroundImage]="''" [showBuildLink]="true">
  <div layoutBackground class="cover">
    <img [src]="coverImage" alt="" width="1280" height="720" fetchpriority="high" />
    <div class="veil"></div>
  </div>

  <div class="home-content">
    <h1>Stream your clips, in every quality.</h1>
    <p>Videoflix is a video platform built end to end: from upload and conversion to playback in your browser.</p>

    <div class="actions">
      <app-demo-button></app-demo-button>
      <a routerLink="/register" class="signup-link">Sign up</a>
    </div>
  </div>
</app-auth-layout>
