<button type="button" class="tile" [attr.aria-label]="video.title" (click)="open.emit(video)">
  <span class="media">
    @if (video.thumbnail_url) {
      <img [src]="video.thumbnail_url" alt="" loading="lazy" decoding="async" width="267" height="150" />
    } @else {
      <span class="placeholder"></span>
    }
    @if (video.visibility === 'private') {
      <span class="badge">Private</span>
    }
  </span>
  <span class="title">{{ video.title }}</span>
  <span class="category">{{ video.category }}</span>
</button>
