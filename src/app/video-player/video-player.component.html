<div class="player-overlay">
  <button class="close-btn" (click)="closeDialog()" aria-label="Player schließen">
    <mat-icon>close</mat-icon>
  </button>
  <button class="quality-btn" mat-button [matMenuTriggerFor]="qualityBtn" [attr.aria-label]="'Auflösung ' + selectedResolution">{{ selectedResolution }}</button>
  <mat-menu #qualityBtn="matMenu">
    <button mat-menu-item (click)="onResolutionChange('2160p')">2160p</button>
    @for (res of video.resolutions; track res.id) {
      <button mat-menu-item (click)="onResolutionChange(res.resolution)">
        {{ res.resolution }}
      </button>
    }
  </mat-menu>
  <video #videoPlayer controls preload="auto" crossorigin></video>
</div>
